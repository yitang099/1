<script>
 
        $(function () {
 
            setTimeout("check_login1()", 1300);
        });



        function wx() {

            $("#wx").show();

            $("#login").hide();

            $("#reg").hide();

        }

        function reg(){

            $("#wx").hide();

            $("#login").hide();

            $("#reg").show();

        }

        function login(){

            $("#wx").hide();

            $("#login").show();

            $("#reg").hide();

        }



        //判断是否扫码

        function check_login() {

            $.ajax({

                type: "get",

                url : "/weixin/wxLogin?uuid=92f57b5760dd4ffeeed6d281abf7177b&share_id=0",

                dataType:'json',

                success: function(data){



                    if (data.status == 1) {

                        ok(data.msg);

                    } else if (data.status == -1) {

                        layer.alert(data.msg, {icon: 2});

                    }else{

                        setTimeout("check_login1()", 1300);

                    }

                },

                error: function (error) {

                    layer.alert("欢迎光临",{icon:2});

                }

            });

        }





        //提交登录

        function doLogin1()

        {

            var sacct = $("#user").val();

            var pwd = $("#pass").val();

            var msg = '';

            if (!sacct) {

                $("#user").focus();

                msg = "请输入账号";

            } else if (!pwd) {

                $('#pass').focus();

                msg = "请输入密码";



            }



            if(msg != ''){

                return error(msg);

            }



            //提交登录

            $.ajax({

                type: "post",

                url : "/wp/public/user/login",

                data: {"username":sacct,"password":pwd},

                dataType:'json',

                success: function(data){

                    if (data.status == 1) {

                        ok(data.msg);

                    } else if (data.status == 0) {

                        error(data.msg);

                    }

                },

                error: function (error) {

                    layer.alert("欢迎光临",{icon:2});

                }

            });

        }



        //提交注册

        function doReg()

        {



            var sacct = $("#reg_username").val();

            var pwd1 = $("#reg_pass1").val();

            var pwd2 = $("#reg_pass2").val();

            var nick = $("#reg_nickname").val();

            var email = $("#reg_email").val();



            var msg = '';



            if(!nick){

                $("#reg_nickname").focus();

                msg = "请输入昵称";

            } else if (!sacct) {

                $("#reg_username").focus();

                msg = "请输入账号";

            } else if (!pwd1) {

                $('#reg_pass1').focus();

                msg = "请输入密码";

            }

            else if (pwd1.length < 6 || pwd1.length > 32) {

                $('#reg_pass1').focus();

                msg = "密码长度最短6位，最长32位！";



            }else if (!pwd2) {

                $('#reg_pass2').focus();

                msg = "请重复输入密码";



            }else if (pwd1 != pwd2) {

                $('#reg_pass1').focus();

                msg = "两次密码不一致！请检查";

            }else if(!email){

                $('#reg_email').focus();

                msg = "请输入安全邮箱";

            }



            if(msg != ''){

                return error(msg);

            }



            //提交注册

            $.ajax({

                type: "post",

                url : "/wp/public/user/register?share_id=0",

                data: {

                    "nickname":nick,

                    "username":sacct,

                    "password":pwd1,

                    "email":email

                },

                dataType:'json',

                success: function(data){

                    if (data.code == 1) {

                        ok(data.msg);

                    } else {

                        error(data.msg);

                    }

                },

                error: function (error) {

                    layer.alert("欢迎光临",{icon:2});

                }

            });

        }



        //成功

        function ok(msg)

        {

            if (self != top) {

                parent.layer.alert(msg,{

                    icon: 1,

                    end: function () {

                        parent.location.reload();

                    },

                });

            }else{

                layer.alert(msg,{

                    icon: 1,

                    end: function () {

                        location.reload();

                    },

                });

            }

        }



        //失败

        function error(msg)

        {

            //layer.msg(msg, function(){});

            $(".errorBox").html(msg);

            $(".errorBox").show();

        }

    </script>
	  <script>  
function doLogin() {  
    event.preventDefault();  
    $.ajax({  
        url: $('#loginform').attr('action'), 
        type: $('#loginform').attr('method'), 
        data: $('#loginform').serialize(), 
        success: function(response) {  
        if (response.status === 'success') {  
            window.location.href = '/wp/public/user/index/';  
        } else {  
            window.location.href = '/wp/public/user/index/';  
        }  
    },  
        error: function(jqXHR, textStatus, errorThrown) {  
            layer.alert('登录成功', {icon: 2});  
        }  
    });  
}
