    <body>
        <div id="main">
            <div style="text-align:center">
                <div class="make">
                                        <p><img class="logo" src="/public/static/pay/eupay/img/tether.svg" style="height:50px;" alt="logo"></p>
                    					<span style="font-weight:bold;font-size:12px">
						<p>商户单号:8A35A2887BD8</p>
						<p>订单编号:2026080417171122</p>
						<p>点击钱包地址或金额可直接复制</p>
					</span>
                    <p class="money" id="copy-amount" data-clipboard-text="8.31" style="font-weight:bold; color:green;font-size:25px">8.31 USDT</p><br>
                    <p class="qr-code"></p>

<script src="/public/static/pay/eupay/js/jquery.min.js"></script>
<script src="/public/static/pay/eupay/js/jquery.qrcode.min.js"></script>
<script src="/public/static/pay/eupay/js/clipboard.min.js"></script>
<script src="/public/static/pay/eupay/js/layer.min.js"></script>
<script>
  // 支付时间倒计时
  function clock() {
    let timeout = new Date(1785836279000);
    let now = new Date();
    let ms = timeout.getTime() - now.getTime();//时间差的毫秒数
    let second = Math.round(ms / 1000);
    let minute = Math.floor(second / 60);
    let hour = Math.floor(minute / 60);
    if(minute > 60) minute %= 60
    if (ms <= 0) {
      layer.alert("支付超时，请重新发起支付！");
      return;
    }
    $("#divTime").html("有效时间:<small style='color:red; font-size:30px'>" + hour + "</small>时<small style='color:red; font-size:30px'>" + minute + "</small>分<small style='color:red; font-size:30px'>" + (second % 60) + "</small>秒,失效勿付");
    return setTimeout(clock, 1000);
  }
  setTimeout(clock, 1000);

  $('.qr-code').qrcode({
    text: "TJGhSHDkZqF9wATeYPsnVuEFAuGCrQ4qGx",
    width: 200,
    height: 200,
    foreground: "#000000",
    background: "#ffffff",
    typeNumber: -1
  });

  // 金额复制
  var copyAmount = new ClipboardJS('#copy-amount');
  copyAmount.on('success', function (e) {
    layer.msg('复制金额成功');
  });
  copyAmount.on('error', function (e) {
    layer.msg('复制金额失败');
  });

  // 钱包复制
  var copyToken = new ClipboardJS('#copy-token');
  copyToken.on('success', function (e) {
    layer.msg('复制钱包地址成功');
  });
  copyToken.on('error', function (e) {
    layer.msg('复制钱包地址失败');
  });

  function checkOrderStatus() {
    $.ajax({
      type: "POST",
      dataType: "json",
      url: "/Buy_Ajax.html",
      timeout: 10000,
	  data: {ddid: "8A35A2887BD8"}, 
      success: function (data) {
        if (data.code == 1) {
          layer.msg('支付成功，正在跳转中...', {shade: 0.01, time: 20000});
          window.location.href="http://fak86.top/Return_View/8A35A2887BD8";
        } else {
          setTimeout("checkOrderStatus()", 5000);
        }
      },
      //Ajax请求超时，继续查询
      error: function (e) {
        setTimeout("checkOrderStatus()", 3000);
      }
    });
  }
  window.onload = checkOrderStatus();
</script>
