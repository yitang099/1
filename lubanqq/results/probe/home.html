    <script>
        acg.ready("3", () => {
            let __html = $('.__html').html();
            let __htmlInit = () => {
                $('.commodity-di').show();
                $('.__html').html(__html);
            }
            let __htmlUnload = () => {
                $('.commodity-di').hide();
                $('.__html').html("");
            }

            __htmlUnload();

            let defaultCommodity = "";
            let categoryValidProducts = {}; // 追踪每个分类是否有有效商品

            function inventoryHidden(state, count) {
                if (state == 0) {
                    return count;
                }
                if (count <= 0) {
                    return '已售罄';
                } else if (count <= 5) {
                    return '马上卖完';
                } else if (count <= 20) {
                    return '一般';
                } else if (count > 20) {
                    return '充足';
                }
            }

            // 检查并处理分类显示/隐藏
            function checkCategoryVisibility(categoryId) {
                const categoryElement = $(`.category-${categoryId}`).closest('.card');
                if (categoryValidProducts[categoryId] && categoryValidProducts[categoryId] > 0) {
                    categoryElement.show();
                } else {
                    categoryElement.hide();
                }
            }

            // 刷新分类库存状态
            function refreshCategoryStock() {
                // 遍历所有隐藏的分类
                $('.card:visible .category-list').each(function() {
                    const categoryId = $(this).find('tbody').attr('class').replace('category-', '');
                    // 重新获取该分类的商品
                    acg.API.commoditys({
                        keywords: "",
                        categoryId: categoryId,
                        success: item => {
                            // 检查是否有有效商品
                            if (item.stock_state != 0 && item.stock > 0) {
                                categoryValidProducts[categoryId] = (categoryValidProducts[categoryId] || 0) + 1;
                                checkCategoryVisibility(categoryId);
                            }
                        },
                        empty: () => {
                            categoryValidProducts[categoryId] = 0;
                            checkCategoryVisibility(categoryId);
                        },
                        yes: () => {}
                    });
                });
            }

            let dom = {
                pageViewExec() {
                    let height = 760;
                    let pageHeight = $('.layui-layer-page[type=page]').height();
                    let top = ($(window).height() - height) / 2;
                    if (pageHeight > height) {
                        $('.layui-layer-page[type=page]').css("top", top + "px");
                        $('.layui-layer-content').css("height", height + "px");
                    } else {
                        let top2 = ($(window).height() - pageHeight) / 2;
                        $('.layui-layer-page[type=page]').css("top", top2 + "px");
                    }
                },
                pageView() {
                    if (acg.Util.isPc()) {
                        dom.pageViewExec();
                        $('.layui-layer-page[type=page]').bind('DOMNodeInserted', function (e) {
                            dom.pageViewExec();
                        });
                        $('.layui-layer-page[type=page] img').each(function () {
                            this.onload = function () {
                                dom.pageViewExec();
                            }
                        });
                    }
                },
                initCategory() {
                    let self = this;

                    acg.API.category({
                        success: function (res) {

                            if (res.commodity_count > 0) {
                                $('.category-list').append(`<div class="card">
                    <div class="card-header">
                        <p class="card-title"><img class="commodity-icon" src="` + res.icon + `"> ` + res.name + `</p>
                    </div>
                    <div class="card-block">
                        <table class="layui-table">
                            <tbody class="category-` + res.id + `">
                            <tr class="head">
                                <th><i class="fa fa-ioxhost" aria-hidden="true"></i> 商品名称</th>
                                <th><i class="fa fa-buysellads" aria-hidden="true"></i> 单价</th>
                                <th><i class="fa fa-bolt" aria-hidden="true"></i> 库存</th>
                                <th></th>
                            </tr>

                            </tbody>
                        </table>
                    </div>
                </div>`);

                                let buyButton = function (item) {
                                    if (item.stock_state == 0 || item.stock <= 0) {
                                        return '<td>-</td>';
                                    }
                                    return `<td><a data-id="` + item.id + `" href="javascript:void (0);" class="commodity-click-` + res.id + `"><i class="fa fa-shopping-cart" aria-hidden="true"></i> 购买</a></td>`;
                                }
                                // 初始化分类有效商品计数
                                categoryValidProducts[res.id] = 0;
                                
                                //请求商品
                                acg.API.commoditys({
                                    keywords: "",
                                    categoryId: res.id,
                                    success: item => {
                                        // 隐藏无库存商品
                                        if (item.stock_state == 0 || item.stock <= 0) {
                                            return;
                                        }
                                        // 增加有效商品计数
                                        categoryValidProducts[res.id]++;
                                        $('.category-' + res.id).append(`<tr class="item">
                                <td><img class="commodity-icon" src="` + item.cover + `"> ` + item.name + `</td>
                                <td>￥` + Math.round(parseFloat(item.price) || 0) + `</td>
                                <td>` + item.stock + `</td>
                                ` + buyButton(item) + `
                            </tr>`);


                                    },
                                    empty: () => {
                                        // 清空有效商品计数
                                        categoryValidProducts[res.id] = 0;
                                    },
                                    yes: () => {
                                        // 检查分类可见性
                                        checkCategoryVisibility(res.id);
                                        
                                        $('.commodity-click-' + res.id).click(function () {
                                            let commodityId = $(this).attr("data-id");
                                            dom.commodity(commodityId);
                                        });

                                        if (defaultCommodity && defaultCommodity != 0) {
                                            $('.commodity-click-' + res.id + '[data-id=' + defaultCommodity + ']').trigger("click");
                                            defaultCommodity = null;
                                        }
                                    }
                                });
                            }


                        }
                    });

                },
                commodity(commodityId) {
                    acg.API.commodity({
                        commodityId: commodityId,
                        pay: ".pay-content",
                        auto: {
                            race: '.race-view',
                            name: '.commodity_name',
                            share_url: '.share_url',
                            description: '.description',
                            delivery_way: '.delivery_way',
                            contact_type: '.contact',
                            coupon: '.coupon',
                            purchase_num: '.purchase_num',
                            captcha: '.captcha',
                            password_status: '.password',
                            lot_status: '.lot',
                            seckill_status: '.seckill',
                            card: '.card_count',
                            purchase_count: '.purchase_count',
                            price: '.price',
                            draft_status: '.draft_status',
                            widget: '.widget',
                            sku: '.sku-view'
                        },
                        begin: () => {
                            __htmlInit();
                        },
                        success: res => {
                            $('.qq-service').attr("href", 'https://wpa.qq.com/msgrd?v=1&uin=' + res.service_qq);
                            $('.web-service').attr("href", res.service_url);
                            //layer
                            layer.open({
                                type: 1,
                                shade: [0.3, "#fff"],
                                title: acg.Util.isPc() ? false : res.name,
                                content: $('.open-commodity'),
                                area: acg.Util.isPc() ? "620px" : ["100%", "100%"],
                                success: () => {
                                    dom.pageView();
                                }
                            });
                        }
                    });
                }

            }
            dom.initCategory();

            // 每30秒检查一次隐藏的分类
            setInterval(refreshCategoryStock, 30000);

            //初始化支付
            acg.API.pay({
                success: item => {
                    if (item.handle === "#system") {
                                            } else {
                        $('.pay_list').append(' <a class="pay-button" onclick="acg.API.tradePerform(' + item.id + ')" style="line-height: 22px;"><img src="' + item.icon + '"> ' + item.name + '</a>');
                    }
                }
            });
        });
    </script>
